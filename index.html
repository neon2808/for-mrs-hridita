<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mrs. Hridita ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#fff4f8,#ffe4ef);
overflow:hidden;
}

.container{
text-align:center;
z-index:2;
padding:20px;
}

h1{
color:#d94f87;
font-size:2.2rem;
margin-bottom:15px;
}

p{
color:#666;
font-size:1.1rem;
margin-bottom:25px;
}

button{
padding:14px 28px;
font-size:18px;
border:none;
border-radius:50px;
background:#ff5e9c;
color:white;
cursor:pointer;
box-shadow:0 10px 25px rgba(255,94,156,.3);
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

.heart{
position:absolute;
color:#ff6aa9;
animation:float 8s linear infinite;
opacity:.6;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(.5);
}
100%{
transform:translateY(-120vh) scale(1.3);
}
}
</style>
</head>

<body>

<div class="container">
<h1>🌸 A Surprise Awaits 🌸</h1>

<p>
A beautiful anniversary experience is being prepared for<br>
<b>Mrs. Hridita ❤️</b>
</p>

<button onclick="startLetter()">
Open My Heart ❤️
</button>

</div>

<script>

function startLetter(){
alert("The next update will transform this into your animated password screen. ❤️");
}

for(let i=0;i<35;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(15+Math.random()*25)+"px";

h.style.animationDuration=(5+Math.random()*8)+"s";

document.body.appendChild(h);

}

</script>

</body>
</html>
