<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Mrs. Hridita ❤️</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:linear-gradient(180deg,#fff5f8,#ffeef5);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:Arial,sans-serif;
            overflow:hidden;
        }

        h1{
            color:#d95b8d;
            font-size:32px;
            text-align:center;
        }

        p{
            margin-top:15px;
            color:#666;
            text-align:center;
            font-size:18px;
        }

        .container{
            animation:fadeIn 2s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }
    </style>

</head>

<body>

<div class="container">

<h1>🌸 Coming Soon 🌸</h1>

<p>
A beautiful surprise is being prepared<br>
for Mrs. Hridita ❤️
</p>

</div>

</body>
</html>
